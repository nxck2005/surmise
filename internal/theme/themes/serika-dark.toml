name = "serika dark"

# The default: a flat near-black ground, one amber accent carrying all
# emphasis, muted grey for everything secondary, and Wordle's tile colours
# desaturated to sit inside it.

[colors]
bg        = "#0a0a0a"
text      = "#d1d0c5"
accent    = "#e2b714"
muted     = "#646669"
error     = "#ca4754"

correct   = "#6aaa64"
present   = "#c9b458"
absent    = "#3a3a3c"

slot      = "#565758"
key_face  = "#565758"
key_spent = "#1c1c1e"
