name = "tokyo night"
author = "enkia"

[colors]
bg        = "#1a1b26"
text      = "#c0caf5"
accent    = "#7aa2f7"
muted     = "#565f89"
error     = "#f7768e"

correct   = "#9ece6a"
present   = "#e0af68"
absent    = "#292e42"

slot      = "#414868"
key_face  = "#414868"
key_spent = "#16161e"

# Only the phone app reads what follows; the terminal ignores it. On a phone
# the tiles are large blocks of colour, so the wrong-place tile is a shade
# darker to keep it apart from the right-place one by lightness, not hue alone.
[app.colors]
present = "#d4a664"
