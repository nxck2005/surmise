<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- One tile in the default theme: the background colour on the correct
       colour, as the board draws it. TestFaviconUsesTheDefaultTileColours
       holds these to theme.Default. The "s" is a path rather than text, so no
       font is involved. apple-touch-icon.png is made from this file, square
       and full-bleed because iOS rounds the corners itself:
         rsvg-convert -w 180 -h 180 -b '#9ece6a' web/favicon.svg -o web/apple-touch-icon.png -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#9ece6a"/>
  <path d="M21 11.6C19.8 10.3 18 9.6 16 9.6C12.9 9.6 10.9 11.2 10.9 13.4C10.9 15.8 13.1 16.5 16 17.1C19.1 17.7 21.2 18.6 21.2 21.1C21.2 23.5 19 24.9 16 24.9C13.8 24.9 11.9 24.1 10.7 22.7" fill="none" stroke="#1a1b26" stroke-width="3.4" stroke-linecap="round"/>
</svg>
