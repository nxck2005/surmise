name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A tag push matches neither trigger above, so release.yml calls this rather
  # than keeping a second copy of the matrix that could drift from it.
  workflow_call:

permissions:
  contents: read

# Re-pushing a branch supersedes the run in flight rather than queueing behind it.
#
# The name is a literal rather than ${{ github.workflow }} because this workflow
# is also *called* by release.yml, and in a called workflow that context is the
# caller's name. Both files would then compute the same group, and
# cancel-in-progress would have this run cancel the release run invoking it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The real signal. Windows is here on purpose: internal/store writes atomically
  # with a temp file + os.Rename and resolves os.UserConfigDir(), both of which
  # behave differently there.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A Windows-only failure should still report the Unix results.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Follow the toolchain in go.mod so there is one place to bump it.
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race ./...

  # Hygiene: cheap, platform-independent, one job. Kept separate from the matrix
  # so a linter can be added here later without touching the test job.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # third_party is someone else's code, held byte-for-byte so the drift
      # check below can prove it. A future toolchain's formatter changing its
      # mind about it must not fail this build.
      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' | grep -v '^third_party/'))
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      # The dependency set is deliberately Charm-only; this keeps an unused
      # module from drifting back into go.mod unnoticed.
      #
      # GOWORK=off on purpose: the check has to measure the go.mod a downstream
      # consumer resolves, not the one the workspace happens to build.
      - name: tidy
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code go.mod go.sum

      # The browser build has no platform in the test matrix, so without this
      # step it breaks silently the next time internal/ui is touched.
      - name: wasm
        run: |
          GOOS=js GOARCH=wasm go build ./...
          GOOS=js GOARCH=wasm go vet ./...

      # Compiling is not running. This drives the real binary against a stub
      # xterm.js and asserts on what it writes, which is the only automated
      # cover the browser build has.
      #
      # Two of its checks earn their place on their own: a js.Func callback that
      # blocks hangs the whole runtime, and a missing colour profile renders the
      # game in monochrome. Neither shows up in a compile.
      - name: wasm smoke test
        run: |
          GOOS=js GOARCH=wasm go build -o /tmp/surmise.wasm .
          node scripts/smoke-web.mjs /tmp/surmise.wasm

      # Proves the vendored copy is upstream plus exactly the two patch files.
      # See third_party/bubbletea/PATCHES.md.
      - name: bubbletea copy is unmodified
        run: bash scripts/check-bubbletea.sh
