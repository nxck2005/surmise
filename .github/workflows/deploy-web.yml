name: Deploy web

# Two deploys out of one file. A push to main refreshes the staging URL, and a
# v* tag promotes a build to production, so the live page matches the release
# people can download rather than whatever main happens to hold.
#
# The archives carry no wasm, because the browser build is a deployment and not
# a download. What the two share is the version string and the tag that starts
# them.
#
# A tag is deliberately NOT a trigger here. release.yml calls this workflow
# after its tests pass, so a tag can never promote an untested build to
# production. Triggering on the tag as well would deploy immediately and beside
# the release, which is the thing being prevented — and it could not simply call
# ci.yml instead, because release.yml already does: both callers would compute
# the concurrency group ci-<tag>, and cancel-in-progress would have one kill the
# other. See the note at the top of ci.yml.
#
# Production is a release-chain decision: a stable tag promoted through
# release.yml goes to production, and a manual dispatch is staging even against
# a stable tag, so the live site can never run ahead of the chain that tested it.
on:
  push:
    branches: [main]
  workflow_call:
    # Declared so release.yml can pass exactly these two by name. A push or a
    # manual dispatch reads the same names from the repository as usual.
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

# Two pushes to main must not race to be the staging URL. Literal name, distinct
# from ci.yml's and release.yml's — see the note in ci.yml for why.
concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub writes a deployment record for a job that names an environment,
    # which gives the repo a deployment history with no app installed.
    environment:
      # The same expression as IS_PRODUCTION below, because environment.name
      # cannot read the job's own env: a manual dispatch on a stable tag still
      # records itself as staging.
      name: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      # wrangler reads both from the environment, so the token never appears on
      # a command line. With the account ID set, wrangler does not have to list
      # the token's accounts, which would need a permission the token lacks.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      # Production only when a non-prerelease tag reached here without a manual
      # dispatch. Every shell step below reads this one value, so the deploy
      # target and the header check cannot disagree about which kind of run
      # this is.
      IS_PRODUCTION: ${{ github.event_name != 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Follow the toolchain in go.mod, as CI and the release do.
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: build
        run: |
          # A tag is the version minus the leading v, exactly as release.yml
          # computes it, so the page and the archives agree about what they are.
          # A push to main is not a release and must not claim a version number.
          case "$GITHUB_REF" in
            refs/tags/*) version="${GITHUB_REF_NAME#v}" ;;
            *) version="dev-$(git rev-parse --short HEAD)" ;;
          esac
          # The same check as release.yml: the version goes into -ldflags, and
          # a git ref may hold a quote.
          if ! [[ "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|dev-[0-9a-f]+)$ ]]; then
            echo "$GITHUB_REF_NAME does not give a version this build can stamp"
            exit 1
          fi
          bash scripts/build-web.sh "$version"

      # The CLI is installed from worker/'s lockfile, not fetched by npx: a
      # lockfile pins the whole dependency tree with integrity hashes, so the
      # deploy runs the same bytes every time rather than trusting whatever the
      # registry serves for a version string.
      #
      # It is installed into the runner's temp directory rather than the
      # checkout, so nothing it brings in can sit under the repository where
      # `go vet ./...` walks. The lockfile stays in the tree; the install does
      # not.
      #
      # --ignore-scripts because this job holds the Cloudflare token one step
      # later: a lifecycle script in a compromised dependency could rewrite the
      # binary that step runs. Uploading static assets needs none of them.
      - name: install the deploy CLI
        run: |
          cp worker/package.json worker/package-lock.json "$RUNNER_TEMP/"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP"

      - name: deploy
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          # Production only for a release tag that did not arrive by hand.
          # Everything else — main, a manual dispatch, an rc tag — goes to the
          # staging Worker, which is what makes main safe to push to.
          #
          # A pre-release tag (v1.2.3-rc1) is deliberately not production: it
          # still deploys, so the exact tagged build can be opened and played
          # before the real tag promotes it, but it lands on staging. The *-*
          # test matches release.yml's prerelease flag, so one tag cannot be a
          # prerelease on GitHub and the live site at the same time.
          #
          # --env= with nothing after it names the top level, production, out
          # loud; leaving the flag off does the same but makes wrangler warn.
          env=--env=
          if [ "$IS_PRODUCTION" != "true" ]; then env=--env=staging; fi
          "$RUNNER_TEMP/node_modules/.bin/wrangler" deploy --config worker/wrangler.jsonc "$env"

          # wrangler writes what it deployed as JSON lines, so the address is
          # read rather than scraped from its progress output. It is the
          # Worker's workers.dev address: the account's subdomain is not
          # written down anywhere in the repo.
          url=$(jq -r 'select(.type == "deploy") | .targets[0] // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [ -z "$url" ]; then
            echo "wrangler reported no address for this deploy"
            exit 1
          fi
          url="${url%/}/"
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "deployed $url" >>"$GITHUB_STEP_SUMMARY"

      # The headers are checked on every deploy, production included: the CSP
      # is the page's whole XSS defence, and a change that drops it must not
      # reach the live site unobserved. This is the only place the headers in
      # web/_headers can be proven — the file says they should be served, but
      # only the deployed site shows whether Cloudflare applied it. The icons
      # are checked here too, because build-web.sh copies files by name and a
      # missing one fails silently.
      #
      # The check runs against the workers.dev address of the Worker that was
      # just deployed, which is public for staging and production alike. A
      # production deploy is then checked again at the custom domain, the
      # address players use. That domain is attached in the Cloudflare
      # dashboard, not by this job, so a deploy cannot prove it is still
      # attached: a removed domain, a changed DNS record or a bad certificate
      # breaks it while workers.dev keeps working. Staging has no custom
      # domain.
      - name: verify the deployed site
        env:
          SITE: ${{ steps.deploy.outputs.url }}
          CUSTOM_DOMAIN: https://surmise.nxck.dev/
        run: |
          get() { curl --silent --show-error "${@:2}" "$1"; }

          # rule PATH HEADER: the value web/_headers sets for HEADER under the
          # exact rule line PATH.
          rule() {
            awk -v path="$1" -v h="$2" '
              /^[^ \t#]/ { inblock = ($0 == path); next }
              inblock && tolower($1) == tolower(h) ":" {
                sub(/^[ \t]*[^:]*:[ \t]*/, ""); print; exit
              }' web/_headers
          }
          # check URL PATH HEADER...: each header URL sends must equal the
          # value web/_headers sets. Compared, not only looked for: a weakened
          # CSP is still a CSP header, and only the value says whether it is
          # the policy that was meant.
          check() {
            local url=$1 path=$2 headers header want got
            shift 2
            headers=$(get "$url" --head | tr -d '\r')
            for header in "$@"; do
              want=$(rule "$path" "$header")
              if [ -z "$want" ]; then
                echo "web/_headers sets no $header for $path" >&2
                exit 1
              fi
              got=$(echo "$headers" | grep -i "^$header:" | head -n1 | cut -d: -f2- | sed 's/^ *//')
              if [ "$got" != "$want" ]; then
                echo "$url serves $header: '$got'" >&2
                echo "web/_headers sets: '$want'" >&2
                exit 1
              fi
            done
            # The headers go to stdout for a caller that checks more; the
            # failures above go to stderr, so a caller capturing this still
            # shows them.
            echo "$headers"
          }

          # verify SITE: everything below, against one address of the Worker.
          verify() {
            local site=$1 want attempt wasm file status

            # A new version can take a moment to reach every edge, and a check
            # in that gap reads the old build. So wait until the site serves
            # this build before checking anything. boot.js carries the wasm's
            # hash, so it differs between any two builds.
            want=$(sha256sum <web/dist/boot.js)
            for attempt in $(seq 1 12); do
              if [ "$(get "${site}boot.js" | sha256sum)" = "$want" ]; then break; fi
              if [ "$attempt" = 12 ]; then
                echo "$site is still not serving this build after two minutes"
                exit 1
              fi
              sleep 10
            done

            check "$site" '/*' content-security-policy x-content-type-options x-frame-options referrer-policy >/dev/null
            wasm=$(check "${site}surmise.wasm" /surmise.wasm cache-control)
            # Browsers refuse to stream-compile wasm served as anything else.
            if ! echo "$wasm" | grep -qi '^content-type: application/wasm'; then
              echo "${site}surmise.wasm is not served as application/wasm:"
              echo "$wasm" | grep -i '^content-type:' || echo "(no content-type)"
              exit 1
            fi

            for file in favicon.svg apple-touch-icon.png; do
              status=$(get "$site$file" --output /dev/null --write-out '%{http_code}')
              if [ "$status" != 200 ]; then
                echo "$site$file returned $status"
                exit 1
              fi
            done

            # _headers is configuration, and Cloudflare must not serve it.
            status=$(get "${site}_headers" --output /dev/null --write-out '%{http_code}')
            if [ "$status" = 200 ]; then
              echo "${site}_headers is served as a file"
              exit 1
            fi
            echo "verified $site" >>"$GITHUB_STEP_SUMMARY"
          }

          verify "$SITE"
          if [ "$IS_PRODUCTION" = "true" ]; then verify "$CUSTOM_DOMAIN"; fi
