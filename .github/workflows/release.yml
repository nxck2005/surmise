name: Release

# Cutting a release is pushing a tag; there is no other trigger, so nothing is
# published by accident from a branch.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Re-pushing a tag supersedes the run in flight, as in CI. Literal name, and it
# must stay distinct from ci.yml's — see the note there.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A tag push does not match CI's own triggers, so a release would otherwise
  # ship whatever the tag points at, untested. Calling CI rather than repeating
  # it keeps one matrix to maintain.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # A broken target should still report the others.
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Follow the toolchain in go.mod, as CI does.
          go-version-file: go.mod

      # Nothing before this step may write into the tree: the commit and the
      # "dirty" flag in `surmise -version` come from the toolchain's own VCS
      # stamps, and a modified worktree would mark every release binary dirty.
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Explicit, because a native macOS or Linux build would otherwise
          # default this on and a release would differ by runner. Nothing here
          # uses cgo; the word lists and themes are go:embed, which is a
          # compile-time feature and cross-compiles with no special handling.
          CGO_ENABLED: 0
        run: |
          # The tag is the version, minus the leading v: `surmise -version` then
          # prints "surmise 1.2.3 …", the form the README documents.
          version="${GITHUB_REF_NAME#v}"
          # A git ref may hold a quote, and the version goes into -ldflags
          # inside one. Only a semver tag is a release, so anything else stops
          # here rather than being quoted around.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          name=surmise
          if [ "$GOOS" = windows ]; then name=surmise.exe; fi

          mkdir -p dist/pkg
          go build -trimpath \
            -ldflags "-s -w -X github.com/nxck2005/surmise/internal/build.version=$version" \
            -o "dist/pkg/$name" .

          # The archive carries what someone unpacking it needs to get going.
          # THEMES.md keeps its docs/ directory rather than being flattened
          # alongside the rest, because the README shipping beside it links to
          # docs/THEMES.md and that link has to resolve inside the archive too.
          cp README.md LICENSE THIRD_PARTY_NOTICES.md dist/pkg/
          mkdir -p dist/pkg/docs
          cp docs/THEMES.md dist/pkg/docs/

          base="surmise_${version}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = windows ]; then
            (cd dist/pkg && zip -qr "../$base.zip" .)
          else
            tar -czf "dist/$base.tar.gz" -C dist/pkg .
          fi
          rm -rf dist/pkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surmise_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  # The Android app: one signed universal APK, beside the archives. The key
  # lives only in the repository's secrets and with the maintainer offline;
  # a lost key means no update can reach existing installs.
  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: mobile/go.mod
          cache-dependency-path: mobile/go.sum
      - name: NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" >/dev/null
      - name: bind the engine
        working-directory: .
        run: scripts/build-android-core.sh
      - name: build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SURMISE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SURMISE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SURMISE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # versionCode = major*10,000,000 + minor*10,000 + patch*10 + n, n
          # being N for -rcN (1-8) and 9 for a final, so an rc sorts below
          # its release. Any other tag shape builds no APK.
          if [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-rc([1-8]))?$ ]]; then
            n=${BASH_REMATCH[5]:-9}
            code=$(( BASH_REMATCH[1] * 10000000 + BASH_REMATCH[2] * 10000 + BASH_REMATCH[3] * 10 + n ))
          else
            echo "tag $GITHUB_REF_NAME builds no APK"
            exit 1
          fi
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$SURMISE_KEYSTORE_PASSWORD" ] ||
             [ -z "$SURMISE_KEY_ALIAS" ] || [ -z "$SURMISE_KEY_PASSWORD" ]; then
            echo "the ANDROID_* signing secrets are not set"
            exit 1
          fi
          export SURMISE_KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$SURMISE_KEYSTORE"
          ./gradlew assembleRelease -PsurmiseVersion="$version" -PsurmiseVersionCode="$code"
          rm -f "$SURMISE_KEYSTORE"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/surmise_${version}_android.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: surmise_android
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    # The only job that needs to write, so the token is widened here rather
    # than at the top of the file. id-token is for the attestation: the
    # provenance signature is bound to this workflow run by an OIDC token, not
    # by the repository token.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          # One flat directory, since the checksums file and the upload both
          # want the archives side by side.
          merge-multiple: true
          # The CI android job runs in this same workflow run and uploads its
          # debug APK as "surmise-debug-apk". Only the release artifacts belong
          # in dist: the debug APK is signed with the debug key, not the
          # release key, and must not be published or checksummed. The release
          # artifacts are "surmise_android" and "surmise_<os>_<arch>", which
          # this pattern matches; the debug one has a hyphen after "surmise".
          pattern: surmise_*

      # Has to happen here, not in the matrix: a matrix job cannot see the
      # other targets' archives.
      - name: checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      # Attached before the release is published, so a release that exists is
      # one whose archives can be traced back to this workflow and commit:
      # `gh attestation verify <archive> -R <repo>`. The subjects are read from
      # the checksums file, so the attested digests are exactly the published
      # ones and checksums.txt itself is not a subject.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job downloads artifacts rather than checking out, so gh has no
          # git remote to infer the repository from and needs telling.
          GH_REPO: ${{ github.repository }}
        run: |
          # A tag with a pre-release suffix (v1.2.3-rc1) must not become the
          # "latest" release people are pointed at.
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac

          # PR titles are conventional-commit style, so the generated notes
          # read as a changelog without one being maintained by hand.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $prerelease

  # The browser build ships the same tag to the web. It is called from here
  # rather than triggered by the tag itself, so the same tests that gate the
  # archives gate the deployment, and the live site can never run ahead of a
  # release that failed to publish.
  #
  # The called workflow sees this run's github context, so the tag decides
  # production against staging inside it exactly as a tag push would.
  # The two CLOUDFLARE_* secrets it reads are passed by name, rather than with
  # `secrets: inherit`, which would hand it every secret the repository has.
  deploy:
    needs: release
    uses: ./.github/workflows/deploy-web.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
